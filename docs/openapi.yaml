openapi: 3.1.0
info:
  title: Tablero API
  version: 0.1.0
  description: |
    API del tablero kanban colaborativo.

    **Autenticación.** Las rutas protegidas exigen `Authorization: Bearer <access_token>`,
    un JWT HS256 de corta duración (15 min por defecto) que devuelven `/auth/register`
    y `/auth/login`. Esas dos rutas también fijan un refresh token en la cookie
    `refresh_token` (`HttpOnly; Path=/auth`; `Secure`, `SameSite` y `Domain` según
    `COOKIE_SECURE`, `COOKIE_SAMESITE` y `COOKIE_DOMAIN`) y el mismo access
    token en la cookie `access_token` (`Path=/boards`), que **solo** acepta
    `GET /boards/{id}/events` porque `EventSource` no puede enviar cabeceras; el resto
    de rutas exige la cabecera `Authorization`. Cuando el access token caduca,
    `POST /auth/refresh` lo renueva con la cookie y rota el refresh token;
    `POST /auth/logout` lo revoca y borra las dos cookies.

    **Errores.** Todas las respuestas de error tienen la forma
    `{"error": {"code": "...", "message": "..."}}`; los errores de validación (422)
    añaden `error.fields` con un mensaje por campo. Cualquier ruta puede responder
    `500 internal_error`; una ruta inexistente responde `404 not_found` y un método
    no soportado `405 method_not_allowed` (con cabecera `Allow`).

    **Peticiones que cambian estado** (POST, PUT, PATCH, DELETE). Si traen `Origin`,
    tiene que ser uno de `CORS_ORIGINS`; sin `Origin`, `Sec-Fetch-Site` no puede ser
    `cross-site` ni `same-site`. Si no, `403 csrf_rejected` (docs/DECISIONS.md, decisión 10).
    Los cuerpos deben ser `Content-Type: application/json` (si no, `415
    unsupported_media_type`) de 256 KiB como mucho (si no, `413 body_too_large`).

    **Límites.** Login, registro y entrada de invitado tienen límites por IP y por
    correo: al pasarlos responden `429 rate_limited` con `Retry-After` (segundos).
    Cada usuario puede tener `SSE_MAX_PER_USER` streams abiertos y cada board
    `SSE_MAX_PER_BOARD`; uno más recibe `429 too_many_streams`. Ver docs/SECURITY.md.

    **Autorización por workspace.** Toda ruta bajo un workspace (miembros, boards,
    columnas, tareas, actividad) se autoriza con el rol del usuario en ese workspace:

    | Acción | admin | member | viewer |
    |---|---|---|---|
    | Leer workspace, miembros, boards, etiquetas, tareas y actividad | ✓ | ✓ | ✓ |
    | Crear, editar, mover y borrar tareas | ✓ | ✓ | |
    | Crear, editar y borrar etiquetas | ✓ | ✓ | |
    | Gestionar boards y columnas | ✓ | | |
    | Gestionar miembros | ✓ | | |

    Hay dos 403 distintos, ambos con `code: forbidden`:
    - **"No tienes acceso a este workspace"**: el usuario no es miembro, *o* el recurso
      (workspace, board, columna o tarea) no existe, *o* el id no es válido. La
      respuesta es idéntica en los tres casos para no revelar qué existe.
    - **"Tu rol no permite esta acción"**: es miembro pero su rol no alcanza.

    Por eso un recurso inexistente responde 403 y no 404. Los 404 documentados solo
    ocurren si el recurso se borra entre la autorización y la operación.

    **Concurrencia optimista.** Editar o mover una tarea (incluidos prioridad, fecha,
    responsable, etiquetas y archivado) exige la `version` que el cliente leyó. Si
    otro cambio ganó antes, la respuesta es `409` con el estado actual completo de
    la tarea en `current` (ver `TaskConflict`).

    Todas las respuestas incluyen `X-Request-ID` (se respeta el de la petición si
    viene uno).
servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: health
    description: Estado del servicio (liveness y readiness).
  - name: auth
    description: Registro, login y usuario actual.
  - name: workspaces
    description: Workspaces, sus ajustes y sus miembros.
  - name: invitations
    description: Invitar a un workspace por correo (sin enviar correos) o con un enlace.
  - name: boards
    description: Tableros de un workspace.
  - name: columns
    description: Columnas de un tablero y su orden.
  - name: tasks
    description: Tareas, con concurrencia optimista por `version`.
  - name: labels
    description: Etiquetas de un tablero, que se asignan a sus tareas.
  - name: activity
    description: Registro de cambios de un tablero.
  - name: events
    description: |
      Cambios de un tablero en tiempo real (Server-Sent Events). El catálogo de eventos,
      con ejemplos y reglas para el cliente, está en `docs/EVENTS.md`.
  - name: metrics
    description: Métricas del servicio en formato Prometheus.
  - name: demo
    description: Modo demo (`DEMO_MODE=true`) con cuentas de invitado. Ver «Datos de demo» en el README.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: "Liveness: el proceso está vivo y atiende"
      description: |
        No consulta la base de datos: una caída de Postgres no debe hacer que se
        reinicie una API sana. Para saber si puede atender tráfico, `GET /ready`.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /ready:
    get:
      tags: [health]
      summary: "Readiness: la API puede atender, con la base de datos disponible"
      operationId: getReady
      security: []
      responses:
        "200":
          description: La base de datos responde.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: |
            La base de datos no responde (`db_unavailable`), o la API recibió SIGTERM y se
            está apagando (`shutting_down`): sigue atendiendo `SHUTDOWN_DELAY` para que el
            balanceador deje de enviarle tráfico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /metrics:
    get:
      tags: [metrics]
      summary: Métricas en formato de texto de Prometheus (0.0.4)
      operationId: getMetrics
      security: []
      description: |
        Sin autenticación: en producción debe quedar solo en la red interna (ver los límites
        en `docs/DECISIONS.md`). Los valores son de **esta instancia**; con varias, Prometheus
        suma o agrega.

        | Métrica | Tipo | Qué mide |
        |---|---|---|
        | `tablero_sse_connections` | gauge | Streams SSE abiertos. |
        | `tablero_events_published_total{type}` | counter | Eventos de board publicados tras su commit, por tipo (`task.moved`…). Solo los de cambios hechos en esta instancia. |
        | `tablero_sse_slow_clients_dropped_total` | counter | Clientes expulsados por lentos (su buffer de 64 eventos se llenó). |
        | `tablero_sse_delivery_seconds` | histogram | Desde que se publica un evento hasta que su mensaje se vacía (`Flush`) hacia un cliente. Una observación por evento y cliente; solo eventos en vivo, no reenvíos al reconectar. |
        | `go_goroutines`, `go_memstats_heap_alloc_bytes`, `go_memstats_heap_inuse_bytes`, `go_memstats_stack_inuse_bytes`, `go_memstats_sys_bytes`, `go_gc_cycles_total` | gauge / counter | Runtime de Go. |
      responses:
        "200":
          description: Las métricas.
          content:
            text/plain; version=0.0.4:
              schema: { type: string }
              example: |
                # HELP tablero_sse_connections Open SSE event streams on this instance.
                # TYPE tablero_sse_connections gauge
                tablero_sse_connections 500
                # HELP tablero_events_published_total Board events published by this instance after their commit, by type.
                # TYPE tablero_events_published_total counter
                tablero_events_published_total{type="task.moved"} 300
                # HELP tablero_sse_delivery_seconds Time from publishing a board event to flushing it to an SSE client (live events only, not replays).
                # TYPE tablero_sse_delivery_seconds histogram
                tablero_sse_delivery_seconds_bucket{le="0.0005"} 120000
                tablero_sse_delivery_seconds_bucket{le="+Inf"} 150000
                tablero_sse_delivery_seconds_sum 61.2
                tablero_sse_delivery_seconds_count 150000

  /auth/register:
    post:
      tags: [auth]
      summary: Crear una cuenta e iniciar sesión
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, maxLength: 254, description: Se normaliza a minúsculas. }
                name: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 128, description: "Longitud en caracteres, no bytes." }
      responses:
        "201":
          description: Cuenta creada; sesión iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "409":
          description: Ya existe una cuenta con ese correo (`email_taken`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401":
          description: |
            Credenciales inválidas (`invalid_credentials`, "Correo o contraseña incorrectos").
            La respuesta es idéntica si el correo no existe, la contraseña es incorrecta
            o los campos están vacíos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/guest:
    post:
      tags: [demo]
      summary: Entrar como invitado (modo demo)
      operationId: startGuest
      security: []
      description: |
        Solo con `DEMO_MODE=true`. Crea una cuenta temporal, miembro del workspace de
        demo, e inicia su sesión como `POST /auth/login` (mismas cookies y cuerpo), más
        el tablero de demo que abrir. La cuenta se borra en el primer reset del demo
        después de `DEMO_GUEST_TTL`.
      responses:
        "201":
          description: Sesión de invitado iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Session"
                  - type: object
                    required: [workspace_id, board_id]
                    properties:
                      workspace_id: { type: string, format: uuid }
                      board_id: { type: string, format: uuid }
        "404":
          description: El modo demo no está activo (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            Ya hay `DEMO_MAX_GUESTS` invitados activos (`guest_limit`), o esta IP pasó su
            límite de invitados (`rate_limited`, con `Retry-After`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: El demo todavía no se ha cargado (`demo_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /demo:
    get:
      tags: [demo]
      summary: Si el modo demo está activo
      operationId: getDemo
      security: []
      description: La pantalla de login lo consulta para ofrecer «Entrar como invitado».
      responses:
        "200":
          description: Estado del modo demo.
          content:
            application/json:
              schema:
                type: object
                required: [guest_access]
                properties:
                  guest_access: { type: boolean, description: "`POST /auth/guest` está disponible." }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar la sesión
      operationId: refreshSession
      description: |
        Canjea la cookie `refresh_token` por una sesión nueva. El refresh token es de un
        solo uso: queda revocado y la respuesta fija uno nuevo en la cookie (rotación).
        Dos renovaciones simultáneas con el mismo token no pueden tener éxito ambas.

        Si vuelve un token ya rotado hace más de 30 segundos, se asume robado y se
        revocan **todas** las sesiones del usuario. Dentro de esos 30 segundos (una
        respuesta perdida, dos pestañas renovando a la vez) solo responde 401.
      security: []
      responses:
        "200":
          description: Sesión renovada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: |
            Falta la cookie o el token no existe, caducó o está revocado (`unauthorized`).
            La respuesta borra las dos cookies de sesión.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearedCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión
      operationId: logout
      description: |
        Revoca el refresh token de la cookie y borra las dos cookies de sesión. No exige
        access token, para que una sesión caducada también pueda cerrarse. Sin cookie, o
        con un token desconocido o ya revocado, responde igual.
      security: []
      responses:
        "204":
          description: Sesión cerrada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearedCookies" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me:
    get:
      tags: [auth]
      summary: Usuario autenticado
      operationId: getMe
      responses:
        "200":
          description: El usuario del token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces:
    post:
      tags: [workspaces]
      summary: Crear un workspace (el creador queda como admin y propietario)
      operationId: createWorkspace
      description: |
        Cada usuario puede crear como máximo 2 workspaces (`max_created` en `GET /workspaces`).
        Pertenecer a otros, por defecto o porque le añadieron, no cuenta; borrar uno libera
        su hueco. Sin `slug`, la dirección sale del nombre (numerada si está ocupada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { $ref: "#/components/schemas/Slug" }
      responses:
        "201":
          description: Workspace creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Ya creó el máximo de workspaces (`workspace_limit`) o la dirección está ocupada (`slug_taken`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [workspaces]
      summary: Workspaces del usuario, con su rol y el número de miembros
      operationId: listWorkspaces
      responses:
        "200":
          description: Lista (vacía si no pertenece a ninguno).
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, created, max_created]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
                  created:
                    type: integer
                    description: Cuántos workspaces ha creado el usuario.
                  max_created:
                    type: integer
                    description: Cuántos puede crear como máximo.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspace-slugs:
    get:
      tags: [workspaces]
      summary: Si una dirección está libre, o una libre para un nombre
      operationId: checkWorkspaceSlug
      description: Con `slug`, dice si está libre; con `name` (y sin `slug`), propone la dirección que tendría.
      parameters:
        - { name: slug, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        "200":
          description: La dirección, normalizada, y si está libre.
          content:
            application/json:
              schema:
                type: object
                required: [slug, available]
                properties:
                  slug: { type: string }
                  available: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspace-slugs/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [workspaces]
      summary: El workspace con esa dirección (solo para sus miembros)
      operationId: findWorkspaceBySlug
      description: A quien no es miembro se le responde igual que si nadie tuviera la dirección (403).
      responses:
        "200":
          description: Su id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [workspaces]
      summary: Un workspace con sus ajustes y lo que contiene
      operationId: getWorkspace
      description: "Permiso: leer."
      responses:
        "200":
          description: El workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [workspaces]
      summary: Cambiar los ajustes del workspace
      operationId: updateWorkspace
      description: "Permiso: admin. Solo cambia los campos presentes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { $ref: "#/components/schemas/Slug" }
                description: { type: string, maxLength: 500 }
                default_role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: El workspace actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: La dirección está ocupada (`slug_taken`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [workspaces]
      summary: Eliminar el workspace con todo lo que contiene
      operationId: deleteWorkspace
      description: |
        Permiso: admin. Se borran sus tableros, tareas, miembros e invitaciones. El workspace
        por defecto (al que entran las cuentas nuevas) no se puede eliminar.
      responses:
        "204": { description: Workspace eliminado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Es el workspace por defecto (`default_workspace`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces/{id}/transfer:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [workspaces]
      summary: Transferir la propiedad a otro admin
      operationId: transferWorkspace
      description: |
        Solo el propietario (cualquier admin si no tiene). Mientras lo es, nadie puede
        degradarle ni quitarle, ni puede salir (`owner_stays_admin`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "200":
          description: El workspace, con su nuevo propietario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDetail" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces/{id}/invitations:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [invitations]
      summary: Invitaciones por correo pendientes (incluidas las caducadas)
      operationId: listInvitations
      description: "Permiso: admin."
      responses:
        "200":
          description: Las más recientes primero.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [invitations]
      summary: Invitar por correo
      operationId: invite
      description: |
        Permiso: admin. No se envía ningún correo. Quien ya tiene cuenta entra al momento
        con ese rol (un miembro conserva el suyo); para el resto queda una invitación de
        7 días que se acepta al registrarse con ese correo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails, role]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Qué pasó con cada correo.
          content:
            application/json:
              schema:
                type: object
                required: [added, invited, already_members]
                properties:
                  added:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  invited:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
                  already_members:
                    type: array
                    items: { type: string, format: email }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
