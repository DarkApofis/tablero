  /boards/{id}/events:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [events]
      summary: Stream de eventos del board (text/event-stream)
      operationId: streamBoardEvents
      description: |
        Permiso: leer (viewer o más). Autenticación con la cookie `access_token` (pensada
        para `EventSource`, que no envía cabeceras) o con `Authorization: Bearer`.

        Primero envía `retry: 3000`. Luego, un mensaje por cada evento de dominio del
        board ya confirmado: `id` (el id de su entrada en la actividad), `event` (el tipo:
        `task.created`, `task.updated`, `task.archived`, `task.moved`, `task.deleted`,
        `column.created`, `column.updated`, `column.reordered`, `column.deleted`,
        `label.changed`) y `data` (`StreamEvent`; su `payload` depende del tipo, ver
        `x-sse-events`). El catálogo completo, con ejemplos, está en `docs/EVENTS.md`.

        **Reconexión.** Con `Last-Event-ID` (lo envía `EventSource` al reconectar) o
        `?last_event_id=` reenvía en orden los eventos posteriores a ese id y sigue en vivo,
        sin huecos ni duplicados. Si faltan más de 500, o el id no es de este board,
        envía `event: resync` con `id` el último evento: el cliente debe recargar el board
        (`GET /boards/{id}`) y seguir desde ahí. Un id que no es un número se trata como 0.
        Sin `Last-Event-ID`, el stream empieza en vivo.

        Con `?exclude_self=true` (o la cabecera `X-Exclude-Self: true`) no envía los eventos
        del propio usuario.

        **Presencia.** Justo después de `retry` envía `presence.snapshot` con los usuarios
        conectados al board (él incluido), y luego `presence.joined` / `presence.left`
        cuando alguien entra o sale. Varias pestañas de un usuario cuentan una vez.
        `presence.left` se envía 4 s después de cerrarse su última conexión, y no se envía
        si vuelve antes (una recarga). Los mensajes de presencia **no llevan `id`**, así que
        no mueven el `Last-Event-ID` del cliente ni se reenvían al reconectar: el
        `presence.snapshot` de cada conexión es el estado completo.

        Cada 25 s envía el comentario `: ping` y vuelve a comprobar el acceso: si el usuario
        ya no es miembro, cierra el stream. También termina si el cliente se desconecta, si
        se queda tan atrás que llena su buffer (al reconectar recibe lo que le falta) o al
        apagar el servidor. Cabeceras: `Cache-Control: no-cache` y `X-Accel-Buffering: no`.
      parameters:
        - name: Last-Event-ID
          in: header
          description: Id del último evento recibido.
          schema: { type: string }
        - name: last_event_id
          in: query
          description: Igual que `Last-Event-ID`, para abrir un `EventSource` nuevo.
          schema: { type: string }
        - name: exclude_self
          in: query
          schema: { type: boolean, default: false }
        - name: X-Exclude-Self
          in: header
          schema: { type: boolean, default: false }
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: El stream; no termina mientras el cliente siga conectado.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Mensajes SSE (`id:`, `event:`, `data:` y una línea en blanco). El `data` de
                  cada tipo de mensaje sigue el esquema de `x-sse-events`. `resync` lleva `id`;
                  los de presencia, no.
              x-sse-events:
                task.created: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/TaskCreatedPayload" } }
                task.updated: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/TaskUpdatedPayload" } }
                task.archived: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/TaskUpdatedPayload" } }
                task.moved: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/TaskMovedPayload" } }
                task.deleted: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/TaskDeletedPayload" } }
                column.created: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/ColumnCreatedPayload" } }
                column.updated: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/ColumnUpdatedPayload" } }
                column.reordered: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/ColumnReorderedPayload" } }
                column.deleted: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/ColumnDeletedPayload" } }
                label.changed: { data: { $ref: "#/components/schemas/StreamEvent" }, payload: { $ref: "#/components/schemas/LabelChangedPayload" } }
                resync: { data: { $ref: "#/components/schemas/StreamResync" } }
                presence.snapshot: { data: { $ref: "#/components/schemas/PresenceSnapshot" } }
                presence.joined: { data: { $ref: "#/components/schemas/PresenceChange" } }
                presence.left: { data: { $ref: "#/components/schemas/PresenceChange" } }
              example: |
                retry: 3000

                id: 42
                event: task.moved
                data: {"id":42,"type":"task.moved","board_id":"…","actor_id":"…","version":3,"payload":{…},"created_at":"…"}

                : ping

                event: presence.joined
                data: {"type":"presence.joined","board_id":"…","user":{"id":"…","name":"Ana"}}

                id: 57
                event: resync
                data: {"last_event_id":57}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: |
            El usuario ya tiene `SSE_MAX_PER_USER` streams abiertos en esta instancia, o el
            board `SSE_MAX_PER_BOARD` (`too_many_streams`, con `Retry-After`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
  /boards/{id}/presence:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [events]
      summary: Usuarios conectados al stream del board
      operationId: getBoardPresence
      description: |
        Permiso: leer. Lo mismo que el `presence.snapshot` del stream, para leerlo sin abrirlo.
        Se deriva de las conexiones abiertas en este servidor, sin guardarse en ninguna parte.
        Un usuario sigue presente hasta 4 s después de cerrar su última conexión.
      responses:
        "200":
          description: Usuarios presentes, por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/PresenceUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /boards/{id}/labels:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [labels]
      summary: Etiquetas del board
      operationId: listLabels
      description: "Permiso: leer."
      responses:
        "200":
          description: Etiquetas por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [labels]
      summary: Crear una etiqueta
      operationId: createLabel
      description: "Permiso: member o admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { $ref: "#/components/schemas/LabelName" }
                color: { $ref: "#/components/schemas/LabelColor" }
      responses:
        "201":
          description: Etiqueta creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LabelExists" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /labels/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [labels]
      summary: Renombrar o recolorear una etiqueta
      operationId: updateLabel
      description: "Permiso: member o admin. Los campos omitidos conservan su valor."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/LabelName" }
                color: { $ref: "#/components/schemas/LabelColor" }
      responses:
        "200":
          description: Etiqueta actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LabelExists" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [labels]
      summary: Borrar una etiqueta (se quita de todas sus tareas)
      operationId: deleteLabel
      description: |
        Permiso: member o admin. Quitarla de las tareas no cambia su `version`: la
        etiqueta deja de existir, no se edita ninguna tarea.
      responses:
        "204": { description: Etiqueta borrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /boards/{id}/columns:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [columns]
      summary: Crear una columna al final del board
      operationId: createColumn
      description: "Permiso: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "201":
          description: Columna creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /columns/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [columns]
      summary: Renombrar una columna
      operationId: renameColumn
      description: "Permiso: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "200":
          description: Columna actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [columns]
      summary: Borrar una columna (con sus tareas)
      operationId: deleteColumn
      description: "Permiso: admin."
      responses:
        "204": { description: Columna borrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /columns/{id}/move:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [columns]
      summary: Reordenar una columna
      operationId: moveColumn
      description: |
        Permiso: admin. Coloca la columna justo después de `after_id`, o al inicio
        si `after_id` es `null`. La clave es obligatoria. La posición se calcula como
        punto medio entre vecinas; si se agota la precisión se reequilibra el board.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after_id]
              properties:
                after_id:
                  type: [string, "null"]
                  format: uuid
                  description: Columna del mismo board tras la que colocarla; `null` = al inicio.
      responses:
        "200":
          description: Columna con su nueva posición.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Falta `after_id`, apunta a sí misma o a una columna de otro board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /columns/{id}/tasks:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [tasks]
      summary: Crear una tarea al final de la columna
      operationId: createTask
      description: "Permiso: member o admin. Queda registrada como `task_created` en la actividad."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000, default: "" }
                priority: { $ref: "#/components/schemas/Priority" }
                due_date: { type: [string, "null"], format: date, description: AAAA-MM-DD. }
                assignee_id:
                  type: [string, "null"]
                  format: uuid
                  description: Debe ser miembro del workspace.
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Etiquetas del mismo board; los duplicados se ignoran.
      responses:
        "201":
          description: "Tarea creada con `version: 1`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TaskValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [tasks]
      summary: Obtener una tarea
      operationId: getTask
      description: "Permiso: leer."
      responses:
        "200":
          description: La tarea.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [tasks]
      summary: Editar una tarea (concurrencia optimista)
      operationId: updateTask
      description: |
        Permiso: member o admin. Aplica `UPDATE ... WHERE id = $1 AND version = $2`:
        solo tiene efecto si `version` es la actual, y la incrementa. Los campos
        omitidos conservan su valor; `null` vacía `due_date` y `assignee_id`.
        Queda registrada como `task_updated` con el valor anterior y el nuevo de
        cada campo que cambió.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              minProperties: 2
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                priority: { $ref: "#/components/schemas/Priority" }
                due_date: { type: [string, "null"], format: date, description: "AAAA-MM-DD; `null` la quita." }
                assignee_id:
                  type: [string, "null"]
                  format: uuid
                  description: Debe ser miembro del workspace; `null` deja la tarea sin responsable.
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Reemplaza el conjunto completo; `[]` quita todas.
                archived:
                  type: boolean
                  description: "`true` fija `archived_at` (si no lo estaba ya); `false` lo vacía."
                version: { type: integer, format: int32, minimum: 1, description: La versión que el cliente leyó. }
      responses:
        "200":
          description: Tarea actualizada (`version` + 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskConflict" }
        "422": { $ref: "#/components/responses/TaskValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [tasks]
      summary: Borrar una tarea
      operationId: deleteTask
      description: "Permiso: member o admin."
      responses:
        "204": { description: Tarea borrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tasks/{id}/move:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [tasks]
      summary: Mover una tarea (columna y/o posición)
      operationId: moveTask
      description: |
        Permiso: member o admin. La nueva `position` es el punto medio entre los
        vecinos indicados:
        - `afterTaskId` y `beforeTaskId`: entre ambos.
        - solo uno: el otro vecino es la tarea adyacente en ese momento.
        - ninguno: al final de `columnId`.

        Si la precisión se agota, se reequilibra la columna. Usa la misma guarda de
        `version` que la edición. Queda registrada como `task_moved`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columnId, version]
              properties:
                columnId: { type: string, format: uuid, description: "Columna destino, del mismo board." }
                afterTaskId: { type: [string, "null"], format: uuid }
                beforeTaskId: { type: [string, "null"], format: uuid }
                version: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: Tarea movida (`version` + 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `version_conflict`: la tarea cambió desde que el cliente la leyó.
            `neighbors_changed`: `afterTaskId` ya no va antes que `beforeTaskId`
            (la vista de la columna está desactualizada). En ambos casos `current`
            trae la tarea tal como está ahora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskConflict" }
        "422":
          description: |
            Falta `columnId` o `version`, la columna no existe o es de otro board, o un
            vecino no está en la columna destino o es la propia tarea.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: El access token en cookie; solo lo acepta el stream de eventos.

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Un id que no es UUID se trata como recurso inexistente (403).
      schema: { type: string, format: uuid }

  headers:
    RefreshCookie:
      description: |
        Dos cookies: `refresh_token=<opaco>; Path=/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=...`
        y `access_token=<jwt>; Path=/boards; HttpOnly; Secure; SameSite=Lax; Max-Age=<vida del access token>`.
      schema: { type: string }
    ClearedCookies:
      description: |
        Borra `refresh_token` (`Path=/auth`) y `access_token` (`Path=/boards`) con `Max-Age=0`.
      schema: { type: string }

  responses:
    RateLimited:
      description: |
        Demasiados intentos desde esta IP o contra este correo (`rate_limited`). La
        cabecera `Retry-After` dice cuántos segundos esperar.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidJSON:
      description: El cuerpo no es JSON válido (`invalid_json`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Datos inválidos (`validation_error`), con un mensaje por campo en `error.fields`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_error
              message: Revisa los datos enviados
              fields:
                name: El nombre es obligatorio
    Unauthorized:
      description: Falta el token o no es válido (`unauthorized`).
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `forbidden`. "No tienes acceso a este workspace" si no es miembro o el recurso no
        existe (respuesta idéntica en ambos casos); "Tu rol no permite esta acción" si
        es miembro sin el permiso necesario.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: El recurso se borró entre la autorización y la operación (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemberNotFound:
      description: El usuario indicado no es miembro del workspace (`member_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LastAdmin:
      description: El cambio dejaría el workspace sin admin (`last_admin`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LabelExists:
      description: El board ya tiene una etiqueta con ese nombre (`label_exists`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskValidationError:
      description: |
        Datos inválidos (`validation_error`). Además de título, descripción o prioridad
        inválidos: `due_date` con otro formato, `assignee_id` que no es miembro del
        workspace, o `label_ids` con etiquetas inexistentes o de otro board.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_error
              message: Revisa los datos enviados
              fields:
                assignee_id: El responsable debe ser miembro del workspace
    TaskConflict:
      description: |
        La tarea cambió desde que el cliente la leyó (`version_conflict`). `current` es
        la tarea completa tal como está ahora; el cliente puede reconciliar y reintentar
        con `current.version`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskConflict" }
          example:
            error:
              code: version_conflict
              message: La tarea cambió desde que la cargaste
            current:
              id: 485daec0-e2cf-435b-8f71-99ce04a8c742
              column_id: 40105d1c-a149-44f8-880a-6a66d537dc3e
              title: Diseñar login (Ana)
              description: ""
              position: 1024
              version: 2
              priority: high
              due_date: "2026-11-15"
              assignee:
                id: f38cd4ae-1c3e-4541-9e60-c47205c33d13
                name: Ana
              labels:
                - id: 9b1e3c52-6f0e-4d7a-a1c2-3e5f7a9b0c1d
                  board_id: 2f6c8a10-3b4d-4e5f-8a9b-0c1d2e3f4a5b
                  name: Frontend
                  color: "#3ee6b0"
                  created_at: "2026-10-23T19:00:00-05:00"
              archived_at: null
              created_by: f38cd4ae-1c3e-4541-9e60-c47205c33d13
              created_at: "2026-10-23T19:30:04.744832-05:00"
              updated_at: "2026-10-23T19:30:04.758611-05:00"
    InviteInvalid:
      description: El enlace no existe, se reemplazó o caducó (`invite_invalid`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Error inesperado (`internal_error`); el detalle queda en los logs con el request id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, description: Mensaje legible para el usuario. }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Solo en `validation_error`; un mensaje por campo.

    ErrorCode:
      type: string
      enum:
        - invalid_json
        - validation_error
        - invalid_credentials
        - email_taken
        - unauthorized
        - forbidden
        - not_found
        - member_not_found
        - last_admin
        - label_exists
        - version_conflict
        - neighbors_changed
        - method_not_allowed
        - db_unavailable
        - shutting_down
        - guest_limit
        - workspace_limit
        - slug_taken
        - owner_stays_admin
        - default_workspace
        - board_archived
        - invite_invalid
        - demo_unavailable
        - rate_limited
        - csrf_rejected
        - too_many_streams
        - body_too_large
        - unsupported_media_type
        - internal_error

    TaskConflict:
      type: object
      required: [error, current]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
        current: { $ref: "#/components/schemas/Task" }

    Role:
      type: string
      enum: [admin, member, viewer]

    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Se recortan los espacios. }

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Session:
      type: object
      required: [user, access_token, token_type, expires_in]
      properties:
        user: { $ref: "#/components/schemas/User" }
        access_token: { type: string, description: JWT HS256. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Segundos hasta que expira el access token. }

    Slug:
      type: string
      minLength: 3
      maxLength: 40
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: Dirección del workspace; se pasa a minúsculas y se recortan los espacios.

    Workspace:
      type: object
      required: [id, name, slug, created_at, role, member_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: [string, "null"]
          description: Null en un workspace creado por la versión anterior durante un despliegue.
        created_at: { type: string, format: date-time }
        role: { $ref: "#/components/schemas/Role" }
        member_count: { type: integer }

    WorkspaceDetail:
      allOf:
        - $ref: "#/components/schemas/Workspace"
        - type: object
          required: [description, default_role, owner_id, is_owner, may_transfer, board_count, task_count, is_default]
          properties:
            description: { type: string }
            default_role:
              $ref: "#/components/schemas/Role"
              description: El que las invitaciones ofrecen primero.
            owner_id: { type: [string, "null"], format: uuid }
            is_owner: { type: boolean, description: El usuario es su propietario. }
            may_transfer: { type: boolean, description: El usuario puede transferirlo. }
            board_count: { type: integer, description: Boards no archivados. }
            task_count: { type: integer }
            is_default: { type: boolean, description: Es el workspace por defecto, que no se puede eliminar. }

    Invitation:
      type: object
      required: [id, email, role, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    InviteLink:
      type: object
      required: [token, role, created_at, expires_at]
      properties:
        token: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    Member:
      type: object
      required: [user_id, email, name, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }

    Visibility:
      type: string
      enum: [workspace, private]
      description: "`workspace`: todos sus miembros, según su rol. `private`: sus admins y a quienes se dio."

    Board:
      type: object
      required: [id, workspace_id, name, visibility, archived_at, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        archived_at: { type: [string, "null"], format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    BoardSummary:
      allOf:
        - $ref: "#/components/schemas/Board"
        - type: object
          required: [task_count, updated_at, actors]
          properties:
            task_count: { type: integer, description: Tareas no archivadas. }
            updated_at: { type: string, format: date-time, description: Último cambio registrado (o su creación). }
            actors:
              type: array
              maxItems: 4
              description: Quienes lo cambiaron, el más reciente primero.
              items: { $ref: "#/components/schemas/UserRef" }

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    BoardMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            type: object
            required: [user_id, name, email]
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string, format: email }

    BoardDetail:
      allOf:
        - $ref: "#/components/schemas/Board"
        - type: object
          required: [role, labels, columns]
          properties:
            role:
              $ref: "#/components/schemas/Role"
              description: Rol del usuario en el workspace del board.
            labels:
              type: array
              description: Todas las etiquetas del board, por nombre.
              items: { $ref: "#/components/schemas/Label" }
            columns:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Column"
                  - type: object
                    required: [tasks]
                    properties:
                      tasks:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }

    Column:
      type: object
      required: [id, board_id, name, position, created_at]
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        name: { type: string }
        position: { type: number, format: double }
        created_at: { type: string, format: date-time }

    Priority:
      type: string
      enum: [low, medium, high, urgent]
      default: medium

    LabelName: { type: string, minLength: 1, maxLength: 50, description: "Se recortan los espacios; único por board." }

    LabelColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: Hexadecimal de 6 dígitos; se guarda en minúsculas.
      examples: ["#3ee6b0"]

    Label:
      type: object
      required: [id, board_id, name, color, created_at]
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, description: "Hexadecimal en minúsculas, como `#3ee6b0`." }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      required: [id, column_id, title, description, position, version, priority, due_date, assignee, labels, archived_at, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        column_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        position: { type: number, format: double }
        version: { type: integer, format: int32, description: Se incrementa con cada edición o movimiento. }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: [string, "null"], format: date }
        assignee:
          description: "`null` si no tiene responsable."
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        labels:
          type: array
          description: Por nombre.
          items: { $ref: "#/components/schemas/Label" }
        archived_at:
          type: [string, "null"]
          format: date-time
          description: "`null` si no está archivada."
        created_by:
          type: [string, "null"]
          format: uuid
          description: "`null` si el usuario fue borrado."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StreamEvent:
      type: object
      description: El `data` de cada evento de dominio del stream.
      required: [id, type, board_id, actor_id, version, payload, created_at]
      properties:
        id: { type: integer, format: int64, description: "Id del evento: el de su entrada de actividad, igual que el `id` SSE. Crece dentro del board (no es consecutivo)." }
        type:
          type: string
          enum: [task.created, task.updated, task.archived, task.moved, task.deleted, column.created, column.updated, column.reordered, column.deleted, label.changed]
        board_id: { type: string, format: uuid }
        actor_id: { type: [string, "null"], format: uuid, description: "`null` si el usuario fue borrado." }
        version:
          type: [integer, "null"]
          description: Versión de la tarea tras el cambio; `null` en eventos de columna y etiqueta.
        payload:
          description: El payload de la entrada de actividad; su esquema lo decide `type` (ver `x-sse-events` del stream).
          anyOf:
            - $ref: "#/components/schemas/TaskCreatedPayload"
            - $ref: "#/components/schemas/TaskUpdatedPayload"
            - $ref: "#/components/schemas/TaskMovedPayload"
            - $ref: "#/components/schemas/TaskDeletedPayload"
            - $ref: "#/components/schemas/ColumnCreatedPayload"
            - $ref: "#/components/schemas/ColumnUpdatedPayload"
            - $ref: "#/components/schemas/ColumnReorderedPayload"
            - $ref: "#/components/schemas/ColumnDeletedPayload"
            - $ref: "#/components/schemas/LabelChangedPayload"
        created_at: { type: string, format: date-time }

    StreamResync:
      type: object
      description: "El cliente debe recargar el board (`GET /boards/{id}`); el stream sigue desde `last_event_id`."
      required: [last_event_id]
      properties:
        last_event_id: { type: integer, format: int64 }

    PresenceUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PresenceSnapshot:
      type: object
      description: Quién está conectado al abrir el stream (el propio usuario incluido).
      required: [type, board_id, users]
      properties:
        type: { type: string, const: presence.snapshot }
        board_id: { type: string, format: uuid }
        users:
          type: array
          items: { $ref: "#/components/schemas/PresenceUser" }

    PresenceChange:
      type: object
      required: [type, board_id, user]
      properties:
        type: { type: string, enum: [presence.joined, presence.left] }
        board_id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/PresenceUser" }

    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        next_cursor:
          type: [string, "null"]
          description: "`null` en la última página."

    ActivityItem:
      type: object
      required: [id, type, actor, payload, created_at]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [task_created, task_updated, task_archived, task_moved, task_deleted, column_created, column_updated, column_reordered, column_deleted, label_changed]
        actor:
          description: "`null` si el usuario fue borrado."
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        payload:
          description: Depende de `type` (el esquema que aplica lo decide `type`, no la forma del objeto).
          anyOf:
            - $ref: "#/components/schemas/TaskCreatedPayload"
            - $ref: "#/components/schemas/TaskUpdatedPayload"
            - $ref: "#/components/schemas/TaskMovedPayload"
            - $ref: "#/components/schemas/TaskDeletedPayload"
            - $ref: "#/components/schemas/ColumnCreatedPayload"
            - $ref: "#/components/schemas/ColumnUpdatedPayload"
            - $ref: "#/components/schemas/ColumnReorderedPayload"
            - $ref: "#/components/schemas/ColumnDeletedPayload"
            - $ref: "#/components/schemas/LabelChangedPayload"
        created_at: { type: string, format: date-time }

    TaskCreatedPayload:
      type: object
      required: [task_id, title, description, column_id, position, version, priority, due_date, assignee_id, label_ids]
      description: La tarea completa al crearla.
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        column_id: { type: string, format: uuid }
        position: { type: number }
        version: { type: integer, const: 1 }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: [string, "null"], format: date }
        assignee_id: { type: [string, "null"], format: uuid }
        label_ids:
          type: array
          items: { type: string, format: uuid }

    TaskUpdatedPayload:
      type: object
      description: "Payload de `task_updated` y de `task_archived` (una edición que archivó la tarea)."
      required: [task_id, title, version, changes]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string, description: Título tras el cambio. }
        version: { type: integer }
        changes:
          type: object
          description: |
            Solo los campos que cambiaron, con su valor anterior (`from`) y el nuevo
            (`to`), codificados como en la API. Quitar a un miembro del workspace
            registra un `assignee_id` que pasa a `null`.
          properties:
            title: { $ref: "#/components/schemas/StringChange" }
            description: { $ref: "#/components/schemas/StringChange" }
            priority: { $ref: "#/components/schemas/StringChange" }
            due_date: { $ref: "#/components/schemas/NullableStringChange" }
            assignee_id: { $ref: "#/components/schemas/NullableStringChange" }
            archived_at: { $ref: "#/components/schemas/NullableStringChange" }
            label_ids:
              type: object
              required: [from, to]
              description: Ids ordenados.
              properties:
                from: { type: array, items: { type: string, format: uuid } }
                to: { type: array, items: { type: string, format: uuid } }

    TaskMovedPayload:
      type: object
      required: [task_id, title, version, from, to]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer }
        from: { $ref: "#/components/schemas/TaskPlacement" }
        to: { $ref: "#/components/schemas/TaskPlacement" }
        rebalanced:
          type: array
          description: Solo si el movimiento reequilibró la columna destino; la nueva posición de cada tarea de la columna (sus versiones no cambian).
          items:
            type: object
            required: [task_id, position]
            properties:
              task_id: { type: string, format: uuid }
              position: { type: number }

    TaskDeletedPayload:
      type: object
      required: [task_id, title, column_id, version]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        column_id: { type: string, format: uuid }
        version: { type: integer, description: La última versión que tuvo. }

    ColumnCreatedPayload:
      type: object
      required: [column_id, name, position]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string }
        position: { type: number }

    ColumnUpdatedPayload:
      type: object
      required: [column_id, name, changes]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string, description: Nombre tras el cambio. }
        changes:
          type: object
          properties:
            name: { $ref: "#/components/schemas/StringChange" }

    ColumnReorderedPayload:
      type: object
      required: [column_id, name, from, to]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string }
        from: { type: number }
        to: { type: number }
        rebalanced:
          type: array
          description: Solo si hubo que reequilibrar el board; la nueva posición de cada columna.
          items:
            type: object
            required: [column_id, position]
            properties:
              column_id: { type: string, format: uuid }
              position: { type: number }

    ColumnDeletedPayload:
      type: object
      required: [column_id, name, deleted_task_ids]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string }
        deleted_task_ids:
          type: array
          description: Las tareas que se borraron con ella.
          items: { type: string, format: uuid }

    LabelChangedPayload:
      type: object
      required: [action, label]
      description: Borrar una etiqueta también la quita de sus tareas, sin cambiar su versión.
      properties:
        action: { type: string, enum: [created, updated, deleted] }
        label:
          type: object
          description: La etiqueta tras el cambio (antes de borrarla, en `deleted`).
          required: [id, name, color]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            color: { type: string }
        changes:
          type: object
          description: Solo en `updated`.
          properties:
            name: { $ref: "#/components/schemas/StringChange" }
            color: { $ref: "#/components/schemas/StringChange" }

    StringChange:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    NullableStringChange:
      type: object
      required: [from, to]
      description: "Fechas como AAAA-MM-DD, `archived_at` como date-time, ids como uuid; `null` = vacío."
      properties:
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }

    TaskPlacement:
      type: object
      required: [column_id, position]
      properties:
        column_id: { type: string, format: uuid }
        position: { type: number }
