openapi: 3.1.0
info:
  title: Tablero API
  version: 0.1.0
  description: |
    API del tablero kanban colaborativo.

    **Autenticación.** Las rutas protegidas exigen `Authorization: Bearer <access_token>`,
    un JWT HS256 de corta duración (15 min por defecto) que devuelven `/auth/register`
    y `/auth/login`. Esas dos rutas también fijan un refresh token en la cookie
    `refresh_token` (`HttpOnly; Secure; SameSite=Lax; Path=/auth`) y el mismo access
    token en la cookie `access_token` (`Path=/boards`), que **solo** acepta
    `GET /boards/{id}/events` porque `EventSource` no puede enviar cabeceras; el resto
    de rutas exige la cabecera `Authorization`.

    **Errores.** Todas las respuestas de error tienen la forma
    `{"error": {"code": "...", "message": "..."}}`; los errores de validación (422)
    añaden `error.fields` con un mensaje por campo. Cualquier ruta puede responder
    `500 internal_error`; una ruta inexistente responde `404 not_found` y un método
    no soportado `405 method_not_allowed` (con cabecera `Allow`).

    **Autorización por workspace.** Toda ruta bajo un workspace (miembros, boards,
    columnas, tareas, actividad) se autoriza con el rol del usuario en ese workspace:

    | Acción | admin | member | viewer |
    |---|---|---|---|
    | Leer workspace, miembros, boards, etiquetas, tareas y actividad | ✓ | ✓ | ✓ |
    | Crear, editar, mover y borrar tareas | ✓ | ✓ | |
    | Crear, editar y borrar etiquetas | ✓ | ✓ | |
    | Gestionar boards y columnas | ✓ | | |
    | Gestionar miembros | ✓ | | |

    Hay dos 403 distintos, ambos con `code: forbidden`:
    - **"No tienes acceso a este workspace"**: el usuario no es miembro, *o* el recurso
      (workspace, board, columna o tarea) no existe, *o* el id no es válido. La
      respuesta es idéntica en los tres casos para no revelar qué existe.
    - **"Tu rol no permite esta acción"**: es miembro pero su rol no alcanza.

    Por eso un recurso inexistente responde 403 y no 404. Los 404 documentados solo
    ocurren si el recurso se borra entre la autorización y la operación.

    **Concurrencia optimista.** Editar o mover una tarea (incluidos prioridad, fecha,
    responsable, etiquetas y archivado) exige la `version` que el cliente leyó. Si
    otro cambio ganó antes, la respuesta es `409` con el estado actual completo de
    la tarea en `current` (ver `TaskConflict`).

    Todas las respuestas incluyen `X-Request-ID` (se respeta el de la petición si
    viene uno).
servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: health
    description: Estado del servicio.
  - name: auth
    description: Registro, login y usuario actual.
  - name: workspaces
    description: Workspaces y sus miembros.
  - name: boards
    description: Tableros de un workspace.
  - name: columns
    description: Columnas de un tablero y su orden.
  - name: tasks
    description: Tareas, con concurrencia optimista por `version`.
  - name: labels
    description: Etiquetas de un tablero, que se asignan a sus tareas.
  - name: activity
    description: Registro de cambios de un tablero.
  - name: events
    description: Cambios de un tablero en tiempo real (Server-Sent Events).

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Estado del servicio y de la base de datos
      operationId: getHealth
      security: []
      responses:
        "200":
          description: El servicio y la base de datos responden.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: La base de datos no responde (`db_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register:
    post:
      tags: [auth]
      summary: Crear una cuenta e iniciar sesión
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email, maxLength: 254, description: Se normaliza a minúsculas. }
                name: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 128, description: "Longitud en caracteres, no bytes." }
      responses:
        "201":
          description: Cuenta creada; sesión iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "409":
          description: Ya existe una cuenta con ese correo (`email_taken`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Sesión iniciada.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401":
          description: |
            Credenciales inválidas (`invalid_credentials`, "Correo o contraseña incorrectos").
            La respuesta es idéntica si el correo no existe, la contraseña es incorrecta
            o los campos están vacíos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me:
    get:
      tags: [auth]
      summary: Usuario autenticado
      operationId: getMe
      responses:
        "200":
          description: El usuario del token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces:
    post:
      tags: [workspaces]
      summary: Crear un workspace (el creador queda como admin)
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "201":
          description: Workspace creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [workspaces]
      summary: Workspaces del usuario, con su rol y el número de miembros
      operationId: listWorkspaces
      responses:
        "200":
          description: Lista (vacía si no pertenece a ninguno).
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces/{id}/members:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [workspaces]
      summary: Miembros del workspace
      operationId: listMembers
      description: "Permiso: leer (cualquier miembro)."
      responses:
        "200":
          description: Miembros por orden de incorporación.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces/{id}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [workspaces]
      summary: Cambiar el rol de un miembro
      operationId: changeMemberRole
      description: "Permiso: admin. No se puede degradar al último admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Miembro actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "409": { $ref: "#/components/responses/LastAdmin" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [workspaces]
      summary: Quitar un miembro
      operationId: removeMember
      description: |
        Permiso: admin. No se puede quitar al último admin. Sus tareas en el workspace
        quedan sin responsable (cada una sube su `version` y registra `task_updated`).
      responses:
        "204": { description: Miembro quitado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "409": { $ref: "#/components/responses/LastAdmin" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workspaces/{id}/boards:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [boards]
      summary: Boards del workspace
      operationId: listBoards
      description: "Permiso: leer."
      responses:
        "200":
          description: Boards por fecha de creación.
          content:
            application/json:
              schema:
                type: object
                required: [boards]
                properties:
                  boards:
                    type: array
                    items: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [boards]
      summary: Crear un board
      operationId: createBoard
      description: "Permiso: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "201":
          description: Board creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /boards/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [boards]
      summary: Board con sus etiquetas, columnas y tareas
      operationId: getBoard
      description: |
        Permiso: leer. Columnas y tareas vienen ordenadas por `position` y se leen
        de un mismo snapshot. Una columna sin tareas trae `tasks: []`. Cada tarea trae
        su responsable y sus etiquetas; el número de consultas no depende del número
        de tareas. Las tareas archivadas se omiten salvo con `include_archived=true`.
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: El board completo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [boards]
      summary: Renombrar un board
      operationId: renameBoard
      description: "Permiso: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "200":
          description: Board actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [boards]
      summary: Borrar un board (con sus columnas, tareas y actividad)
      operationId: deleteBoard
      description: "Permiso: admin."
      responses:
        "204": { description: Board borrado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /boards/{id}/activity:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [activity]
      summary: Actividad del board, de la más reciente a la más antigua
      operationId: listBoardActivity
      description: |
        Permiso: leer. Paginación por cursor: pasa `next_cursor` de una página como
        `cursor` para la siguiente. El cursor es estable aunque lleguen entradas
        nuevas entre páginas. `next_cursor` es `null` en la última página.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Valor opaco devuelto en `next_cursor`.
          schema: { type: string }
      responses:
        "200":
          description: Una página de actividad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /boards/{id}/events:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [events]
      summary: Stream de eventos del board (text/event-stream)
      operationId: streamBoardEvents
      description: |
        Permiso: leer (viewer o más). Autenticación con la cookie `access_token` (pensada
        para `EventSource`, que no envía cabeceras) o con `Authorization: Bearer`.

        Primero envía `retry: 3000`. Luego, un mensaje por cada evento de dominio del
        board ya confirmado: `id` (el id de su entrada en la actividad), `event` (el tipo:
        `task.created`, `task.updated`, `task.archived`, `task.moved`, `task.deleted`,
        `column.created`, `column.updated`, `column.reordered`, `column.deleted`,
        `label.changed`) y `data` (ver el esquema).

        **Reconexión.** Con `Last-Event-ID` (lo envía `EventSource` al reconectar) o
        `?last_event_id=` reenvía en orden los eventos posteriores a ese id y sigue en vivo,
        sin huecos ni duplicados. Si faltan más de 500, o el id no es de este board,
        envía `event: resync` con `id` el último evento: el cliente debe recargar el board
        (`GET /boards/{id}`) y seguir desde ahí. Un id que no es un número se trata como 0.
        Sin `Last-Event-ID`, el stream empieza en vivo.

        Con `?exclude_self=true` (o la cabecera `X-Exclude-Self: true`) no envía los eventos
        del propio usuario.

        Cada 25 s envía el comentario `: ping` y vuelve a comprobar el acceso: si el usuario
        ya no es miembro, cierra el stream. También termina si el cliente se desconecta, si
        se queda tan atrás que llena su buffer (al reconectar recibe lo que le falta) o al
        apagar el servidor. Cabeceras: `Cache-Control: no-cache` y `X-Accel-Buffering: no`.
      parameters:
        - name: Last-Event-ID
          in: header
          description: Id del último evento recibido.
          schema: { type: string }
        - name: last_event_id
          in: query
          description: Igual que `Last-Event-ID`, para abrir un `EventSource` nuevo.
          schema: { type: string }
        - name: exclude_self
          in: query
          schema: { type: boolean, default: false }
        - name: X-Exclude-Self
          in: header
          schema: { type: boolean, default: false }
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: El stream; no termina mientras el cliente siga conectado.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Mensajes SSE. El `data` de cada evento sigue `x-sse-data`; el de `resync` es
                  `{"last_event_id": <id>}`.
                x-sse-data:
                  type: object
                  required: [id, type, board_id, actor_id, version, payload, created_at]
                  properties:
                    id: { type: integer, format: int64, description: "Id del evento: el de su entrada de actividad. Crece dentro del board (no es consecutivo)." }
                    type:
                      type: string
                      enum: [task.created, task.updated, task.archived, task.moved, task.deleted, column.created, column.updated, column.reordered, column.deleted, label.changed]
                    board_id: { type: string, format: uuid }
                    actor_id: { type: [string, "null"], format: uuid }
                    version:
                      type: [integer, "null"]
                      description: Versión de la tarea tras el cambio; `null` en eventos de columna y etiqueta.
                    payload:
                      description: "El payload de la entrada de actividad (ver `ActivityItem`): la entidad completa al crear, los campos cambiados al editar."
                    created_at: { type: string, format: date-time }
              example: |
                retry: 3000

                id: 42
                event: task.moved
                data: {"id":42,"type":"task.moved","board_id":"…","actor_id":"…","version":3,"payload":{…},"created_at":"…"}

                : ping

                id: 57
                event: resync
                data: {"last_event_id":57}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /boards/{id}/labels:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [labels]
      summary: Etiquetas del board
      operationId: listLabels
      description: "Permiso: leer."
      responses:
        "200":
          description: Etiquetas por nombre.
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [labels]
      summary: Crear una etiqueta
      operationId: createLabel
      description: "Permiso: member o admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name: { $ref: "#/components/schemas/LabelName" }
                color: { $ref: "#/components/schemas/LabelColor" }
      responses:
        "201":
          description: Etiqueta creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LabelExists" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /labels/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [labels]
      summary: Renombrar o recolorear una etiqueta
      operationId: updateLabel
      description: "Permiso: member o admin. Los campos omitidos conservan su valor."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/LabelName" }
                color: { $ref: "#/components/schemas/LabelColor" }
      responses:
        "200":
          description: Etiqueta actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LabelExists" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [labels]
      summary: Borrar una etiqueta (se quita de todas sus tareas)
      operationId: deleteLabel
      description: |
        Permiso: member o admin. Quitarla de las tareas no cambia su `version`: la
        etiqueta deja de existir, no se edita ninguna tarea.
      responses:
        "204": { description: Etiqueta borrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /boards/{id}/columns:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [columns]
      summary: Crear una columna al final del board
      operationId: createColumn
      description: "Permiso: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "201":
          description: Columna creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /columns/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [columns]
      summary: Renombrar una columna
      operationId: renameColumn
      description: "Permiso: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "200":
          description: Columna actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [columns]
      summary: Borrar una columna (con sus tareas)
      operationId: deleteColumn
      description: "Permiso: admin."
      responses:
        "204": { description: Columna borrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /columns/{id}/move:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [columns]
      summary: Reordenar una columna
      operationId: moveColumn
      description: |
        Permiso: admin. Coloca la columna justo después de `after_id`, o al inicio
        si `after_id` es `null`. La clave es obligatoria. La posición se calcula como
        punto medio entre vecinas; si se agota la precisión se reequilibra el board.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [after_id]
              properties:
                after_id:
                  type: [string, "null"]
                  format: uuid
                  description: Columna del mismo board tras la que colocarla; `null` = al inicio.
      responses:
        "200":
          description: Columna con su nueva posición.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Falta `after_id`, apunta a sí misma o a una columna de otro board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /columns/{id}/tasks:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [tasks]
      summary: Crear una tarea al final de la columna
      operationId: createTask
      description: "Permiso: member o admin. Queda registrada como `task_created` en la actividad."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000, default: "" }
                priority: { $ref: "#/components/schemas/Priority" }
                due_date: { type: [string, "null"], format: date, description: AAAA-MM-DD. }
                assignee_id:
                  type: [string, "null"]
                  format: uuid
                  description: Debe ser miembro del workspace.
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Etiquetas del mismo board; los duplicados se ignoran.
      responses:
        "201":
          description: "Tarea creada con `version: 1`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/TaskValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [tasks]
      summary: Obtener una tarea
      operationId: getTask
      description: "Permiso: leer."
      responses:
        "200":
          description: La tarea.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [tasks]
      summary: Editar una tarea (concurrencia optimista)
      operationId: updateTask
      description: |
        Permiso: member o admin. Aplica `UPDATE ... WHERE id = $1 AND version = $2`:
        solo tiene efecto si `version` es la actual, y la incrementa. Los campos
        omitidos conservan su valor; `null` vacía `due_date` y `assignee_id`.
        Queda registrada como `task_updated` con el valor anterior y el nuevo de
        cada campo que cambió.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              minProperties: 2
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 10000 }
                priority: { $ref: "#/components/schemas/Priority" }
                due_date: { type: [string, "null"], format: date, description: "AAAA-MM-DD; `null` la quita." }
                assignee_id:
                  type: [string, "null"]
                  format: uuid
                  description: Debe ser miembro del workspace; `null` deja la tarea sin responsable.
                label_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Reemplaza el conjunto completo; `[]` quita todas.
                archived:
                  type: boolean
                  description: "`true` fija `archived_at` (si no lo estaba ya); `false` lo vacía."
                version: { type: integer, format: int32, minimum: 1, description: La versión que el cliente leyó. }
      responses:
        "200":
          description: Tarea actualizada (`version` + 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskConflict" }
        "422": { $ref: "#/components/responses/TaskValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [tasks]
      summary: Borrar una tarea
      operationId: deleteTask
      description: "Permiso: member o admin."
      responses:
        "204": { description: Tarea borrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tasks/{id}/move:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [tasks]
      summary: Mover una tarea (columna y/o posición)
      operationId: moveTask
      description: |
        Permiso: member o admin. La nueva `position` es el punto medio entre los
        vecinos indicados:
        - `afterTaskId` y `beforeTaskId`: entre ambos.
        - solo uno: el otro vecino es la tarea adyacente en ese momento.
        - ninguno: al final de `columnId`.

        Si la precisión se agota, se reequilibra la columna. Usa la misma guarda de
        `version` que la edición. Queda registrada como `task_moved`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columnId, version]
              properties:
                columnId: { type: string, format: uuid, description: "Columna destino, del mismo board." }
                afterTaskId: { type: [string, "null"], format: uuid }
                beforeTaskId: { type: [string, "null"], format: uuid }
                version: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: Tarea movida (`version` + 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidJSON" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `version_conflict`: la tarea cambió desde que el cliente la leyó.
            `neighbors_changed`: `afterTaskId` ya no va antes que `beforeTaskId`
            (la vista de la columna está desactualizada). En ambos casos `current`
            trae la tarea tal como está ahora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskConflict" }
        "422":
          description: |
            Falta `columnId` o `version`, la columna no existe o es de otro board, o un
            vecino no está en la columna destino o es la propia tarea.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: El access token en cookie; solo lo acepta el stream de eventos.

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Un id que no es UUID se trata como recurso inexistente (403).
      schema: { type: string, format: uuid }

  headers:
    RefreshCookie:
      description: |
        Dos cookies: `refresh_token=<opaco>; Path=/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=...`
        y `access_token=<jwt>; Path=/boards; HttpOnly; Secure; SameSite=Lax; Max-Age=<vida del access token>`.
      schema: { type: string }

  responses:
    InvalidJSON:
      description: El cuerpo no es JSON válido (`invalid_json`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Datos inválidos (`validation_error`), con un mensaje por campo en `error.fields`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_error
              message: Revisa los datos enviados
              fields:
                name: El nombre es obligatorio
    Unauthorized:
      description: Falta el token o no es válido (`unauthorized`).
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `forbidden`. "No tienes acceso a este workspace" si no es miembro o el recurso no
        existe (respuesta idéntica en ambos casos); "Tu rol no permite esta acción" si
        es miembro sin el permiso necesario.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: El recurso se borró entre la autorización y la operación (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemberNotFound:
      description: El usuario indicado no es miembro del workspace (`member_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LastAdmin:
      description: El cambio dejaría el workspace sin admin (`last_admin`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LabelExists:
      description: El board ya tiene una etiqueta con ese nombre (`label_exists`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskValidationError:
      description: |
        Datos inválidos (`validation_error`). Además de título, descripción o prioridad
        inválidos: `due_date` con otro formato, `assignee_id` que no es miembro del
        workspace, o `label_ids` con etiquetas inexistentes o de otro board.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_error
              message: Revisa los datos enviados
              fields:
                assignee_id: El responsable debe ser miembro del workspace
    TaskConflict:
      description: |
        La tarea cambió desde que el cliente la leyó (`version_conflict`). `current` es
        la tarea completa tal como está ahora; el cliente puede reconciliar y reintentar
        con `current.version`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskConflict" }
          example:
            error:
              code: version_conflict
              message: La tarea cambió desde que la cargaste
            current:
              id: 485daec0-e2cf-435b-8f71-99ce04a8c742
              column_id: 40105d1c-a149-44f8-880a-6a66d537dc3e
              title: Diseñar login (Ana)
              description: ""
              position: 1024
              version: 2
              priority: high
              due_date: "2026-11-15"
              assignee:
                id: f38cd4ae-1c3e-4541-9e60-c47205c33d13
                name: Ana
              labels:
                - id: 9b1e3c52-6f0e-4d7a-a1c2-3e5f7a9b0c1d
                  board_id: 2f6c8a10-3b4d-4e5f-8a9b-0c1d2e3f4a5b
                  name: Frontend
                  color: "#3ee6b0"
                  created_at: "2026-10-23T19:00:00-05:00"
              archived_at: null
              created_by: f38cd4ae-1c3e-4541-9e60-c47205c33d13
              created_at: "2026-10-23T19:30:04.744832-05:00"
              updated_at: "2026-10-23T19:30:04.758611-05:00"
    InternalError:
      description: Error inesperado (`internal_error`); el detalle queda en los logs con el request id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, description: Mensaje legible para el usuario. }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Solo en `validation_error`; un mensaje por campo.

    ErrorCode:
      type: string
      enum:
        - invalid_json
        - validation_error
        - invalid_credentials
        - email_taken
        - unauthorized
        - forbidden
        - not_found
        - member_not_found
        - last_admin
        - label_exists
        - version_conflict
        - neighbors_changed
        - method_not_allowed
        - db_unavailable
        - internal_error

    TaskConflict:
      type: object
      required: [error, current]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }
        current: { $ref: "#/components/schemas/Task" }

    Role:
      type: string
      enum: [admin, member, viewer]

    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Se recortan los espacios. }

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Session:
      type: object
      required: [user, access_token, token_type, expires_in]
      properties:
        user: { $ref: "#/components/schemas/User" }
        access_token: { type: string, description: JWT HS256. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Segundos hasta que expira el access token. }

    Workspace:
      type: object
      required: [id, name, created_at, role, member_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        role: { $ref: "#/components/schemas/Role" }
        member_count: { type: integer }

    Member:
      type: object
      required: [user_id, email, name, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }

    Board:
      type: object
      required: [id, workspace_id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }

    BoardDetail:
      allOf:
        - $ref: "#/components/schemas/Board"
        - type: object
          required: [role, labels, columns]
          properties:
            role:
              $ref: "#/components/schemas/Role"
              description: Rol del usuario en el workspace del board.
            labels:
              type: array
              description: Todas las etiquetas del board, por nombre.
              items: { $ref: "#/components/schemas/Label" }
            columns:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Column"
                  - type: object
                    required: [tasks]
                    properties:
                      tasks:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }

    Column:
      type: object
      required: [id, board_id, name, position, created_at]
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        name: { type: string }
        position: { type: number, format: double }
        created_at: { type: string, format: date-time }

    Priority:
      type: string
      enum: [low, medium, high, urgent]
      default: medium

    LabelName: { type: string, minLength: 1, maxLength: 50, description: "Se recortan los espacios; único por board." }

    LabelColor:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
      description: Hexadecimal de 6 dígitos; se guarda en minúsculas.
      examples: ["#3ee6b0"]

    Label:
      type: object
      required: [id, board_id, name, color, created_at]
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, description: "Hexadecimal en minúsculas, como `#3ee6b0`." }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      required: [id, column_id, title, description, position, version, priority, due_date, assignee, labels, archived_at, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        column_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        position: { type: number, format: double }
        version: { type: integer, format: int32, description: Se incrementa con cada edición o movimiento. }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: [string, "null"], format: date }
        assignee:
          description: "`null` si no tiene responsable."
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        labels:
          type: array
          description: Por nombre.
          items: { $ref: "#/components/schemas/Label" }
        archived_at:
          type: [string, "null"]
          format: date-time
          description: "`null` si no está archivada."
        created_by:
          type: [string, "null"]
          format: uuid
          description: "`null` si el usuario fue borrado."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        next_cursor:
          type: [string, "null"]
          description: "`null` en la última página."

    ActivityItem:
      type: object
      required: [id, type, actor, payload, created_at]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [task_created, task_updated, task_archived, task_moved, task_deleted, column_created, column_updated, column_reordered, column_deleted, label_changed]
        actor:
          description: "`null` si el usuario fue borrado."
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        payload:
          description: Depende de `type` (el esquema que aplica lo decide `type`, no la forma del objeto).
          anyOf:
            - $ref: "#/components/schemas/TaskCreatedPayload"
            - $ref: "#/components/schemas/TaskUpdatedPayload"
            - $ref: "#/components/schemas/TaskMovedPayload"
            - $ref: "#/components/schemas/TaskDeletedPayload"
            - $ref: "#/components/schemas/ColumnCreatedPayload"
            - $ref: "#/components/schemas/ColumnUpdatedPayload"
            - $ref: "#/components/schemas/ColumnReorderedPayload"
            - $ref: "#/components/schemas/ColumnDeletedPayload"
            - $ref: "#/components/schemas/LabelChangedPayload"
        created_at: { type: string, format: date-time }

    TaskCreatedPayload:
      type: object
      required: [task_id, title, description, column_id, position, version, priority, due_date, assignee_id, label_ids]
      description: La tarea completa al crearla.
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        column_id: { type: string, format: uuid }
        position: { type: number }
        version: { type: integer, const: 1 }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: [string, "null"], format: date }
        assignee_id: { type: [string, "null"], format: uuid }
        label_ids:
          type: array
          items: { type: string, format: uuid }

    TaskUpdatedPayload:
      type: object
      description: "Payload de `task_updated` y de `task_archived` (una edición que archivó la tarea)."
      required: [task_id, title, version, changes]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string, description: Título tras el cambio. }
        version: { type: integer }
        changes:
          type: object
          description: |
            Solo los campos que cambiaron, con su valor anterior (`from`) y el nuevo
            (`to`), codificados como en la API. Quitar a un miembro del workspace
            registra un `assignee_id` que pasa a `null`.
          properties:
            title: { $ref: "#/components/schemas/StringChange" }
            description: { $ref: "#/components/schemas/StringChange" }
            priority: { $ref: "#/components/schemas/StringChange" }
            due_date: { $ref: "#/components/schemas/NullableStringChange" }
            assignee_id: { $ref: "#/components/schemas/NullableStringChange" }
            archived_at: { $ref: "#/components/schemas/NullableStringChange" }
            label_ids:
              type: object
              required: [from, to]
              description: Ids ordenados.
              properties:
                from: { type: array, items: { type: string, format: uuid } }
                to: { type: array, items: { type: string, format: uuid } }

    TaskMovedPayload:
      type: object
      required: [task_id, title, version, from, to]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer }
        from: { $ref: "#/components/schemas/TaskPlacement" }
        to: { $ref: "#/components/schemas/TaskPlacement" }
        rebalanced:
          type: array
          description: Solo si el movimiento reequilibró la columna destino; la nueva posición de cada tarea de la columna (sus versiones no cambian).
          items:
            type: object
            required: [task_id, position]
            properties:
              task_id: { type: string, format: uuid }
              position: { type: number }

    TaskDeletedPayload:
      type: object
      required: [task_id, title, column_id, version]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        column_id: { type: string, format: uuid }
        version: { type: integer, description: La última versión que tuvo. }

    ColumnCreatedPayload:
      type: object
      required: [column_id, name, position]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string }
        position: { type: number }

    ColumnUpdatedPayload:
      type: object
      required: [column_id, name, changes]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string, description: Nombre tras el cambio. }
        changes:
          type: object
          properties:
            name: { $ref: "#/components/schemas/StringChange" }

    ColumnReorderedPayload:
      type: object
      required: [column_id, name, from, to]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string }
        from: { type: number }
        to: { type: number }
        rebalanced:
          type: array
          description: Solo si hubo que reequilibrar el board; la nueva posición de cada columna.
          items:
            type: object
            required: [column_id, position]
            properties:
              column_id: { type: string, format: uuid }
              position: { type: number }

    ColumnDeletedPayload:
      type: object
      required: [column_id, name, deleted_task_ids]
      properties:
        column_id: { type: string, format: uuid }
        name: { type: string }
        deleted_task_ids:
          type: array
          description: Las tareas que se borraron con ella.
          items: { type: string, format: uuid }

    LabelChangedPayload:
      type: object
      required: [action, label]
      description: Borrar una etiqueta también la quita de sus tareas, sin cambiar su versión.
      properties:
        action: { type: string, enum: [created, updated, deleted] }
        label:
          type: object
          description: La etiqueta tras el cambio (antes de borrarla, en `deleted`).
          required: [id, name, color]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            color: { type: string }
        changes:
          type: object
          description: Solo en `updated`.
          properties:
            name: { $ref: "#/components/schemas/StringChange" }
            color: { $ref: "#/components/schemas/StringChange" }

    StringChange:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    NullableStringChange:
      type: object
      required: [from, to]
      description: "Fechas como AAAA-MM-DD, `archived_at` como date-time, ids como uuid; `null` = vacío."
      properties:
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }

    TaskPlacement:
      type: object
      required: [column_id, position]
      properties:
        column_id: { type: string, format: uuid }
        position: { type: number }
