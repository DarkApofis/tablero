# The whole app: `docker compose up --build` (add -d --wait to return once it's healthy).
# Postgres → migrations (run once, then exit) → API → frontend, each one waiting
# for the previous to be healthy or done. For `go run`/`pnpm dev` on the host,
# start only the database: `docker compose up -d db`.
#
# Host ports: DB_PORT (5432), API_PORT (8080), WEB_PORT (3000).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tablero
      POSTGRES_PASSWORD: tablero
      POSTGRES_DB: tablero
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablero -d tablero"]
      interval: 5s
      timeout: 3s
      retries: 10

  # goose, applying backend/migrations. It runs to completion and exits 0;
  # the API does not start unless it does.
  migrate:
    build: ./backend
    image: tablero-api:local
    entrypoint: ["/app/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://tablero:tablero@db:5432/tablero?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: tablero-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tablero:tablero@db:5432/tablero?sslmode=disable
      PORT: "8080"
      # The frontend's origin, as the browser sees it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000}}
      # Only for this local/CI stack; production sets its own.
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-y-e2e-no-usar-en-produccion}
      # Browsers accept Secure cookies on http://localhost.
      COOKIE_SECURE: "true"
      EVENTS_BACKEND: memory
      # Demo mode: "Entrar como invitado" and a periodic reset of the demo
      # data (README, "Datos de demo"). Off unless DEMO_MODE=true.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_INTERVAL: ${DEMO_RESET_INTERVAL:-1h}
      DEMO_GUEST_TTL: ${DEMO_GUEST_TTL:-2h}
      # On SIGTERM: /ready turns 503 and the API keeps serving SHUTDOWN_DELAY
      # (what's already queued gets in), then stops accepting and gives the
      # requests in flight SHUTDOWN_TIMEOUT. Both fit in stop_grace_period,
      # after which Docker sends SIGKILL.
      SHUTDOWN_DELAY: 3s
      SHUTDOWN_TIMEOUT: 15s
    stop_grace_period: 20s
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness (/ready pings the database), so `web` waits for an API that can work.
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle: the API as the browser reaches it.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:${API_PORT:-8080}}
    image: tablero-web:local
    restart: unless-stopped
    # tini as PID 1, so SIGTERM reaches node and `docker compose stop` is quick.
    init: true
    stop_grace_period: 20s
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
