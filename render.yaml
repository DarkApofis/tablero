# Render Blueprint: the API (Docker image from backend/) on a free instance in
# Frankfurt. The database is Neon's free Postgres (also Frankfurt), outside
# Render: a free Render Postgres is deleted after 30-44 days. The frontend is
# deployed separately.
# Step-by-step guide, variables and migration strategy: docs/DEPLOY.md.

services:
  - type: web
    name: tablero-api
    runtime: docker
    region: frankfurt
    # Free: sleeps after 15 minutes without inbound requests (an open SSE
    # stream alone does not count), so an external monitor calls /health
    # every 10 minutes (docs/DEPLOY.md, step 5). One always-on free service
    # uses ~744 of the workspace's 750 free hours a month.
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Free instances have no preDeployCommand: the API applies pending
    # migrations itself before listening (MIGRATE_ON_START), while the
    # previous version keeps serving, so they must be backward compatible.
    # Liveness, not /ready: the API only listens once migrated and connected,
    # a database blip must not get it restarted, and the monitor's calls must
    # not wake the database up.
    healthCheckPath: /health
    # Deploy a commit only once CI passes on it.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false # Neon's direct (not pooled) URL, plus &pool_max_conn_idle_time=4m
      - key: JWT_SECRET
        generateValue: true # 256 random bits, generated once
      - key: CORS_ORIGINS
        sync: false # https://app.<your domain>
      - key: MIGRATE_ON_START
        value: "true"
      - key: MIGRATE_LOCK_TIMEOUT
        value: 5s
      - key: PORT
        value: "8080"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax # app.<domain> and api.<domain> are the same site
      - key: TRUST_PROXY
        value: "true" # behind Render's proxy (verify it: docs/DEPLOY.md, step 6)
      - key: EVENTS_BACKEND
        value: memory # one instance
      - key: SHUTDOWN_DELAY
        value: 5s
      - key: SHUTDOWN_TIMEOUT
        value: 20s
      - key: RATE_LIMIT
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: GOMEMLIMIT
        value: 400MiB # leaves room in the 512 MB instance before the OOM killer
