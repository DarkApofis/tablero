name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tablero
          POSTGRES_PASSWORD: tablero
          POSTGRES_DB: tablero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tablero -d tablero_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Integration tests use this server instead of starting a Testcontainers
      # Postgres: each test binary creates, migrates and drops its own database
      # on it (internal/adapters/postgres/pgtest).
      TEST_DATABASE_URL: postgres://tablero:tablero@localhost:5432/tablero_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend

      - name: Tests
        run: go test -count=1 ./...

      - name: Build
        run: go build -o bin/api ./cmd/api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Uses the version pinned in "packageManager".
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Postgres, the migrations and the API, built from this commit
      # (the "app" profile of docker-compose.yml).
      - name: Start the backend
        working-directory: .
        run: docker compose --profile app up -d --build --wait

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves the frontend on :3000 against the API on :8080
      # (playwright.config.ts), seeds three users and runs the scenarios.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Backend logs
        if: failure()
        working-directory: .
        run: docker compose --profile app logs migrate api
